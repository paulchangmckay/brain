title = "gitleaks config for ~/.claude"

[extend]
useDefault = true

# Per skills/senior-engineering-partner SKILL.md: "Allowlist only synthetic test fixtures."
# Vendored third-party code (superpowers, skills/senior-engineering-partner — see
# .gitmodules history and issues #13/#15) is excluded wholesale by path below rather
# than per-finding: it's not ours to line-by-line audit, any real credential there
# would already be public via the upstream repo, and a path regex doesn't silently
# stop working the moment an upstream file shifts by a line (unlike .gitleaksignore's
# file:rule:line fingerprints, which #19 replaced this with).
[[allowlists]]
description = "Vendored third-party code — not ours to secret-scan line-by-line"
paths = [
  '^superpowers/',
  '^skills/senior-engineering-partner/',
]
